# Manual check of a deployed Claim Sense URL (Render, Azure or any other host): waits for readiness, then runs
# the golden-path smoke test and, optionally, the Playwright browser suite (only on a freshly started service,
# because the suite's golden claim must not be a duplicate). Signs in with the DEMO_PASSWORD repository secret
# when it is set, otherwise the default demo password.
name: Verify deployment

on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployed base URL, for example https://claim-sense.onrender.com
        required: true
      browser_tests:
        description: Also run the Playwright browser suite (freshly started service only)
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.url }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD || 'claimsense-demo' }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for readiness (a sleeping free instance can take a minute to start)
        run: |
          for i in $(seq 1 60); do curl -sf "${BASE_URL%/}/api/v1/ready" && exit 0; sleep 5; done
          echo "No ready response from $BASE_URL"; exit 1
      - uses: actions/setup-node@v4
        if: inputs.browser_tests
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser tests (Playwright, Chromium)
        if: inputs.browser_tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure() && inputs.browser_tests
        with:
          name: playwright-report
          path: e2e/report/
      - name: Golden-path smoke test
        run: python3 scripts/smoke_test.py "$BASE_URL"
