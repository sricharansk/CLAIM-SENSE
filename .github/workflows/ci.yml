name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ../scripts
      - run: python -m pytest -q
      - name: Golden evaluation (fails on any check)
        run: python ../scripts/evaluate.py --out ../evaluation-ci
      - name: Data provenance and RAG manifest (registry valid, checksums match, manifest reproducible)
        run: python ../scripts/provenance.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation-ci/
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start app + PostgreSQL
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/ready && exit 0; sleep 2; done
          docker compose logs app; exit 1
      - name: Golden-path smoke test
        run: python3 scripts/smoke_test.py http://localhost:8080
      - if: always()
        run: docker compose down -v
